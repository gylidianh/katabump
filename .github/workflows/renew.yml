name: Katabump Auto Renew

on:
  schedule:
  # 每天监测一次 UTC 02:00 (北京时间 10:00)。每天都跑,到期即续,避免错过续期窗口。
  - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      force_keepalive:
        description: '立即提交一次防停用记录(测试用)'
        type: boolean
        default: false

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: write  # 防停用步骤需要提交代码
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        USERS_JSON: ${{ secrets.USERS_JSON }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

    - name: 💓 防止仓库 60 天无活动导致定时任务被停用
      if: always()
      continue-on-error: true
      env:
        FORCE_KEEPALIVE: ${{ inputs.force_keepalive }}
      run: |
        last=$(git log -1 --format=%ct)
        now=$(date +%s)
        days=$(( (now - last) / 86400 ))
        echo "距上次提交 ${days} 天"
        if [ "$days" -ge 30 ] || [ "$FORCE_KEEPALIVE" = "true" ]; then
          date -u '+%Y-%m-%d %H:%M:%S UTC' > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%F)"
          git push
          echo "✅ 已提交防停用记录"
        else
          echo "未满 30 天，无需提交"
        fi
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
